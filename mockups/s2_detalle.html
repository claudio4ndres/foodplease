<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css">
<style>
.hero {
  margin-top: 12px; height: 240px; border-radius: 28px;
  background: radial-gradient(120% 120% at 30% 20%, #FCEFE3 0%, #F7DFC8 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.hero .emoji { font-size: 104px; filter: drop-shadow(0 18px 22px rgba(158,43,33,.22)); }
.backbtn {
  position: absolute; top: 14px; left: 14px;
  width: 40px; height: 40px; border-radius: 14px;
  background: rgba(255,255,255,.9); box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.titlerow { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 22px; }
.titlerow h1 { font-size: 27px; }
.bigprice { font-size: 24px; font-weight: 800; color: var(--brand-deep); letter-spacing: -.02em; padding-top: 8px; }
.desc-label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 24px; }
.desc-text { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin-top: 8px; }
.meta { display: flex; gap: 12px; margin-top: 20px; }
.metacard {
  flex: 1; background: var(--surface); border-radius: 18px; padding: 14px 16px;
  box-shadow: 0 4px 14px rgba(33,29,24,.05);
}
.metacard .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.metacard .v { font-size: 15px; font-weight: 700; margin-top: 4px; }
.actions { position: absolute; left: 24px; right: 24px; bottom: 26px; display: flex; flex-direction: column; gap: 10px; }
</style></head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span style="display:flex;gap:7px;align-items:center">
      <svg width="18" height="12" fill="#211D18"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg width="16" height="12" fill="none" stroke="#211D18" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5C4.5 1.6 11.5 1.6 14.5 4.5"/><path d="M4 7.2c2.3-2.1 5.7-2.1 8 0"/><circle cx="8" cy="10" r="1.4" fill="#211D18" stroke="none"/></svg>
      <svg width="25" height="12"><rect x="0" y="0" width="21" height="12" rx="3.5" fill="none" stroke="#211D18" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#211D18"/><rect x="22.5" y="4" width="2.5" height="4" rx="1" fill="#211D18" opacity=".4"/></svg>
    </span>
  </div>
  <div class="content">
    <div class="hero">
      <a class="nav backbtn" href="s1_menu.html">
        <svg width="18" height="18" fill="none" stroke="#211D18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L4.5 9l6.5 6"/></svg>
      </a>
      <span class="emoji">🌭</span>
    </div>
    <div class="titlerow">
      <div>
        <h1>Completo Italiano</h1>
        <span class="pill ok" style="margin-top:10px"><span class="dot"></span>Disponible en stock</span>
      </div>
      <div class="bigprice">$3.900</div>
    </div>
    <div class="desc-label">Descripción</div>
    <div class="desc-text">Vienesa en pan copihue recién horneado, con palta molida, tomate en cubos y mayonesa casera. El clásico que nunca falla.</div>
    <div class="meta">
      <div class="metacard">
        <div class="k">Categoría</div>
        <div class="v">Completos</div>
      </div>
      <div class="metacard">
        <div class="k">Publicado</div>
        <div class="v">Hace 3 días</div>
      </div>
    </div>
  </div>
  <div class="actions">
    <a class="nav btn primary" href="s3_form.html">
      <svg width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.5 2.5L6 13.5l-3.5 1 1-3.5z"/></svg>
      Editar plato
    </a>
    <a class="nav btn outline-danger" href="s4_eliminar.html">
      <svg width="16" height="17" fill="none" stroke="#C13529" stroke-width="1.9" stroke-linecap="round"><path d="M2 4.5h12M5.5 4.5V3a1 1 0 011-1h3a1 1 0 011 1v1.5M4 4.5l.8 10a1.5 1.5 0 001.5 1.4h3.4a1.5 1.5 0 001.5-1.4l.8-10"/></svg>
      Eliminar del menú
    </a>
  </div>
</body></html>
