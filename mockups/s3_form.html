<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css">
<style>
.topbar { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.backbtn {
  width: 40px; height: 40px; border-radius: 14px;
  background: var(--surface); box-shadow: 0 4px 14px rgba(33,29,24,.07);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.topbar h1 { font-size: 22px; }
.field { margin-top: 18px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px; }
.input {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 15px 16px; font-size: 16px; color: var(--ink); font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.input.focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(193,53,41,.10); }
.input .prefix { color: var(--muted); font-weight: 700; }
.input .suffix { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.textarea { min-height: 96px; align-items: flex-start; line-height: 1.5; }
.hint { font-size: 12px; color: var(--muted); margin-top: 7px; }
.switchrow {
  margin-top: 20px; background: var(--surface); border-radius: 18px; padding: 16px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 14px rgba(33,29,24,.05);
}
.switchrow .t { font-size: 15px; font-weight: 700; }
.switchrow .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.switch {
  margin-left: auto; width: 52px; height: 32px; border-radius: 999px;
  background: var(--ok); position: relative; flex: none;
}
.switch::after {
  content: ""; position: absolute; top: 3px; right: 3px;
  width: 26px; height: 26px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}
.actions { position: absolute; left: 24px; right: 24px; bottom: 26px; display: flex; flex-direction: column; gap: 6px; }
</style></head>
<body>
  <div class="statusbar">
    <span>9:41</span>
    <span style="display:flex;gap:7px;align-items:center">
      <svg width="18" height="12" fill="#211D18"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg width="16" height="12" fill="none" stroke="#211D18" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5C4.5 1.6 11.5 1.6 14.5 4.5"/><path d="M4 7.2c2.3-2.1 5.7-2.1 8 0"/><circle cx="8" cy="10" r="1.4" fill="#211D18" stroke="none"/></svg>
      <svg width="25" height="12"><rect x="0" y="0" width="21" height="12" rx="3.5" fill="none" stroke="#211D18" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#211D18"/><rect x="22.5" y="4" width="2.5" height="4" rx="1" fill="#211D18" opacity=".4"/></svg>
    </span>
  </div>
  <div class="content">
    <div class="topbar">
      <div class="backbtn">
        <svg width="18" height="18" fill="none" stroke="#211D18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3L4.5 9l6.5 6"/></svg>
      </div>
      <h1>Editar plato</h1>
    </div>
    <div class="field">
      <label>Nombre del plato</label>
      <div class="input focus">Completo Italiano<span style="color:var(--brand);font-weight:300">|</span></div>
    </div>
    <div class="field">
      <label>Descripción</label>
      <div class="input textarea">Vienesa en pan copihue recién horneado, con palta molida, tomate en cubos y mayonesa casera.</div>
      <div class="hint">Se muestra bajo el nombre en el menú.</div>
    </div>
    <div class="field">
      <label>Precio</label>
      <div class="input"><span class="prefix">$</span>3.900<span class="suffix">CLP</span></div>
    </div>
    <div class="switchrow">
      <div>
        <div class="t">Disponible en stock</div>
        <div class="s">Los clientes lo verán en el menú de hoy</div>
      </div>
      <div class="switch"></div>
    </div>
  </div>
  <div class="actions">
    <div class="btn primary">
      <svg width="17" height="17" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5L7 14l7.5-9"/></svg>
      Guardar cambios
    </div>
    <div class="btn ghost">Cancelar</div>
  </div>
</body></html>
